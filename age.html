<!DOCTYPE html>
<HTML>
    <head>
        <title>Java</title>
    </head>
    <body>
        <h2>Check age of Maria</h2>

        <p id="variables"></p>

        <label for="fname">First name:</label> <input type="text" id="fname" name="fname"><br><br>
        <label for="age">Age:</label> <input type="text" id="age" name="age"><br><br>

        <button type="button" 
        onclick="document.getElementById('variables').innerHTML = document.getElementById('fname').value + ' is ' + 
        document.getElementById('age').value + ' year old.'">
            Click Here!
        </button>

        </body>
</HTML>
